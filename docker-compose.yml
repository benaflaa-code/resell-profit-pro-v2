services:
  searxng:
    image: ghcr.io/searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    security_opt:
      - no-new-privileges:true

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "qwen3:4b"]
    restart: "no"

  market-agent:
    build: ./agent
    restart: unless-stopped
    depends_on:
      - searxng
      - ollama
    environment:
      SEARXNG_URL: http://searxng:8080
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3:4b
      AGENT_TOKEN: ${AGENT_TOKEN:?Set AGENT_TOKEN in .env}
      MAX_RESULTS: 7
      MAX_RESPONSE_BYTES: 1000000
      MAX_LOOKUPS_PER_MINUTE: 12
      PYTHONDONTWRITEBYTECODE: 1
    ports:
      - "127.0.0.1:8787:8787"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m

volumes:
  ollama-data:
